<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f5f6fa; --text: #1f2430; --muted: #6b7280; --border: #dfe3ec;
    --bad: #d62f35; --bad-bg: rgba(229, 72, 77, .14);
    --good: #12875a; --good-bg: rgba(31, 157, 99, .15);
    --key: #8a5a00; --key-bg: rgba(255, 196, 0, .30);
    --code-bg: #14161d; --code-text: #e6e9f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171e; --panel: #1e212b; --text: #e6e9f2; --muted: #9aa3b5; --border: #313646;
      --bad: #ff7b80; --bad-bg: rgba(255, 107, 112, .18);
      --good: #4cc38a; --good-bg: rgba(76, 195, 138, .18);
      --key: #ffd666; --key-bg: rgba(255, 196, 0, .20);
      --code-bg: #0e1015;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 56px; background: var(--bg); color: var(--text);
    font: 15px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
  }
  main { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 24px; line-height: 1.3; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 30px 0 8px; display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 12px; font-weight: 700; padding: 1px 10px; border-radius: 999px; }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.good { background: var(--good-bg); color: var(--good); }
  p { margin: 6px 0; }
  .sub { color: var(--muted); margin: 0 0 6px; }
  .bad  { color: var(--bad);  background: var(--bad-bg);  padding: 0 4px; border-radius: 4px; font-weight: 600; }
  .good { color: var(--good); background: var(--good-bg); padding: 0 4px; border-radius: 4px; font-weight: 600; }
  .key  { color: var(--key);  background: var(--key-bg);  padding: 0 4px; border-radius: 4px; font-weight: 600; }
  .box { border: 1px solid var(--border); border-left-width: 4px; border-radius: 8px; padding: 10px 14px; margin: 10px 0; background: var(--panel); }
  .box.bad-box { border-left-color: var(--bad); }
  .box.good-box { border-left-color: var(--good); }
  ol, ul { margin: 4px 0; padding-left: 22px; }
  li { margin: 3px 0; }
  code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .92em; }
  :not(pre) > code { background: var(--panel); border: 1px solid var(--border); padding: 0 5px; border-radius: 4px; }
  pre {
    background: var(--code-bg); color: var(--code-text); border-radius: 10px;
    padding: 12px 16px; overflow-x: auto; margin: 8px 0; font-size: 13px; line-height: 1.6;
  }
  pre .c { color: #7f8aa3; }
  pre .r { color: #ff8a8f; font-weight: 700; }
  pre .g { color: #7ee2a8; font-weight: 700; }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0; font-size: 13px; }
  .flow span { padding: 4px 10px; border-radius: 6px; background: var(--bad-bg); color: var(--bad); font-weight: 600; }
  .flow i { color: var(--muted); font-style: normal; }
  .term { border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin: 10px 0; background: var(--panel); }
  .term b.name { color: var(--key); }
  .steps { counter-reset: s; list-style: none; padding: 0; margin: 10px 0; }
  .steps li { counter-increment: s; position: relative; padding: 6px 0 6px 38px; margin: 0; }
  .steps li::before {
    content: counter(s); position: absolute; left: 0; top: 6px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--good-bg); color: var(--good); font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .viewport { display: grid; grid-template-columns: 150px 1fr; gap: 14px; margin: 12px 0; align-items: stretch; }
  .viewport .screen { border: 2px solid var(--good); border-radius: 8px; background: var(--bg); overflow: hidden; position: relative; min-height: 170px; }
  .viewport .rowx { height: 22px; border-bottom: 1px solid var(--border); font-size: 11px; padding: 2px 8px; color: var(--muted); }
  .viewport .rowx.off { opacity: .35; border-bottom-style: dashed; }
  .viewport .sentinel { position: absolute; left: 0; right: 0; bottom: 20px; height: 22px; background: var(--key-bg); color: var(--key); font-size: 11px; font-weight: 700; text-align: center; line-height: 22px; border-top: 1px dashed var(--key); border-bottom: 1px dashed var(--key); }
  .viewport .legend { font-size: 13px; }
  .viewport .legend div { margin: 4px 0; }
  @media (max-width: 560px) { .viewport { grid-template-columns: 1fr; } }
  td, th { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
  table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14px; }
  th { background: var(--panel); }
  .demo { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin: 12px 0; }
  .demo button { font: inherit; font-size: 13px; padding: 5px 14px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; margin-right: 6px; }
  .demo button.primary { background: var(--good); border-color: var(--good); color: #fff; }
  .demo button:disabled { opacity: .5; cursor: default; }
  .counters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
  .counter { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
  .counter .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .counter .l { font-size: 12px; color: var(--muted); }
  .counter.bad .n { color: var(--bad); }
  .counter.good .n { color: var(--good); }
  .counter.key .n { color: var(--key); }
</style>
</head>
<body>
<main>

<h1>{{TITLE}}</h1>
<p class="sub">{{SUB}}</p>

{{BODY}}

</main>
{{SCRIPT}}
</body>
</html>
